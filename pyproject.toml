[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-multi-agent-disputes"
version = "0.1.0"
description = "Multi-agent Olist e-commerce dispute resolution"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "google-auth>=2.38,<3",
  "langgraph>=0.6,<2",
  "openai>=1.60,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "SQLAlchemy>=2.0,<3",
  "tenacity>=9.0,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "EXE002",  # Windows bind mounts do not preserve POSIX executable bits.
  "FURB157", # Decimal strings document exact monetary inputs.
]

[tool.ruff.lint.per-file-ignores]
"src/database/models.py" = ["RUF012"]
"scripts/validate_outputs.py" = ["BLE001"]
"tests/conftest.py" = ["DTZ001"]

